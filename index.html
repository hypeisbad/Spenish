<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07070d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Spenish — an all-in-one Mexican Spanish translator and learning app: voice translation, face-to-face interpreter, course, flashcards, conjugator, AI tutor, Lotería and more." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Spenish — Español de México</title>
    <style>
      html, body { background: #07070d; color: #f7f2ea; margin: 0; }
      .boot { min-height: 100vh; display: grid; place-items: center; font: 600 18px system-ui, sans-serif; color: #918aa8; }
      .boot span { font-size: 44px; display: block; text-align: center; animation: b 1.2s ease-in-out infinite; }
      @keyframes b { 50% { transform: translateY(-8px); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div><span>🌮</span>Cargando…</div></div></div>

    <script type="module" src="/src/main.tsx"></script>
